[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opener-workflow"
version = "0.1.0"
description = "ORCA-based transition-state workflow"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "Bowen Li"}]
dependencies = [
  "numpy>=1.24,<2.4",
  "scipy>=1.10",
  "ase>=3.22",
  "dscribe>=2.0",
  "openbabel-wheel>=3.1",
  "tqdm>=4.66",
  "pyyaml>=6.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["opener_workflow*"]
